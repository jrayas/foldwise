# Builds the plugin when a version tag is pushed, signs the files with a build attestation
# and attaches them to a GitHub release. The tag must equal the version in manifest.json.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "Foldwise ${GITHUB_REF_NAME}" \
            --generate-notes --verify-tag
